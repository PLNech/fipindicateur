name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true # module + build cache, keyed on go.sum
      - name: Install libmpv and webkit2gtk
        run: sudo apt-get update && sudo apt-get install -y libmpv-dev libwebkit2gtk-4.1-dev
      - name: gofmt
        run: |
          unformatted="$(gofmt -l . | grep -v '/gen/' || true)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt (run 'make fix'):"; echo "$unformatted"; exit 1
          fi
      - name: no em dashes
        run: |
          if grep -rIn --exclude-dir=.git --exclude-dir=.venv --exclude-dir=node_modules "$(printf '\342\200\224')" .; then
            echo "em dash (U+2014) found, replace it (house style: middot, colon, parentheses)"; exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true # module + build cache, keyed on go.sum
      - name: Install mpv
        run: brew install mpv
      # Portability canary for the future macOS target. If this fails, fix the
      # //go:build linux gating (mpris/notify), do not remove this job.
      - run: go build ./...

  build-windows:
    # Cross-build on Linux (mingw-w64), the path 'make windows' actually
    # supports. We do NOT use windows-latest: we validate the cross-compile we
    # ship, not a native toolchain we never use. Runs in parallel with lint.
    runs-on: ubuntu-latest
    env:
      # Pinned libmpv dev drop (reproducibility beats freshness). Bump this one
      # line to move to a newer shinchiro build; the cache key follows the URL.
      MPV_DEV_URL: https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20260610/mpv-dev-x86_64-20260610-git-304426c.7z
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true # module + build cache, keyed on go.sum
      - name: Install mingw-w64 cross toolchain and 7z
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 p7zip-full
      - name: Cache libmpv dev drop
        id: mpv-dev
        uses: actions/cache@v4
        with:
          path: build/windows/mpv-dev
          key: mpv-dev-${{ env.MPV_DEV_URL }}
      - name: Fetch and unpack libmpv dev drop
        if: steps.mpv-dev.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/windows/mpv-dev
          curl -L -o mpv-dev.7z "$MPV_DEV_URL"
          7z x mpv-dev.7z -obuild/windows/mpv-dev
      - name: Cross-build Windows binary
        run: make windows
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: fipindicateur-windows-x86_64
          path: |
            build/windows/fipindicateur.exe
            build/windows/libmpv-2.dll
          if-no-files-found: error

  drawer-visual:
    # The panel belt: the 350-interaction wiring self-test (the real page in
    # the real webkit, headless under xvfb), then a screenshot pass over the
    # drawer's three views in both themes, uploaded for human review.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true # module + build cache, keyed on go.sum
      - name: Install libmpv, webkit2gtk, xvfb and imagemagick
        run: sudo apt-get update && sudo apt-get install -y libmpv-dev libwebkit2gtk-4.1-dev xvfb imagemagick
      - name: Panel wiring self-test (xvfb)
        run: make selftest
      - name: Capture drawer screenshots (light and dark)
        run: |
          set -euo pipefail
          mkdir -p shots
          # One xvfb per theme: launch the design harness (mock state, branded
          # « maquette »), drive its stdin to switch views, grab the root
          # window. --light/--dark force the theme (deterministic headless).
          for theme in light dark; do
            flag="--$theme"
            xvfb-run -a --server-args='-screen 0 1280x900x24' bash -c '
              set -euo pipefail
              theme="$1"; flag="$2"
              mkfifo drive.fifo
              ./fipindicateur drawer $flag < drive.fifo > "drawer-$theme.log" 2>&1 &
              pid=$!
              exec 9> drive.fifo   # hold the driver open: EOF would end the harness stdin loop
              sleep 6              # let webkit settle and paint
              for view in main history settings; do
                echo "view $view" >&9
                sleep 2
                import -window root "shots/drawer-$theme-$view.png"
              done
              exec 9>&-
              kill "$pid" 2>/dev/null || true
              rm -f drive.fifo
            ' _ "$theme" "$flag"
          done
          ls -l shots
      - name: Upload drawer screenshots
        uses: actions/upload-artifact@v4
        with:
          name: drawer-screenshots
          path: shots/*.png
          retention-days: 14
          if-no-files-found: error
